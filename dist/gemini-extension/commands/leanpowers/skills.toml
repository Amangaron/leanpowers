description = "List leanpowers skills and switch them on or off"
prompt = """
If the arguments are not empty, run `node \"${extensionPath}/bin/leanpowers.mjs\" skills {{args}}` and show the output. Otherwise run `node \"${extensionPath}/bin/leanpowers.mjs\" skills --list`, show the output, ask the user which skills to change, and apply them with `node \"${extensionPath}/bin/leanpowers.mjs\" skills --set <name>=on|off,...`. (If `${extensionPath}` is not expanded, the extension folder is the one containing gemini-extension.json.) Arguments: {{args}}
"""
